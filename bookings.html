<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Plan a trip | WanderWise</title><link rel="stylesheet" href="style.css"></head>
<body><header class="site-header"><a class="brand" href="index.html">✈ WanderWise</a><nav><a href="index.html">Home</a><a href="destinations.html">Destinations</a><a class="active" href="bookings.html">My Trips</a><a href="contact.html">Contact</a></nav><a class="nav-cta" href="bookings.html">Plan a trip</a></header>
<main class="page-wrap narrow"><span class="eyebrow">LET'S GET YOU GOING</span><h1 class="page-title">Plan your next trip</h1><p class="lead">Add your travel details to create a trip plan on this device.</p>
<form id="tripForm" class="form-card"><div class="form-grid"><label>Destination<input name="destination" required placeholder="e.g. Goa, India"></label><label>Number of travelers<input name="travelers" type="number" min="1" max="30" value="1" required></label><label>Departure date<input name="departure" type="date" required></label><label>Return date<input name="returnDate" type="date" required></label><label class="full">Travel notes<textarea name="notes" rows="4" placeholder="Hotel preferences, activities, reminders..."></textarea></label></div><button class="button" type="submit">Save trip plan →</button><p class="form-message" id="formMessage" role="status"></p></form>
<section class="saved-section"><div class="section-heading"><div><span class="eyebrow">YOUR SAVED PLANS</span><h2>My trips</h2></div></div><div id="tripList" class="trip-list"></div></section></main>
<footer><a class="brand" href="index.html">✈ WanderWise</a><span>Make every journey count.</span><span>© 2026 WanderWise</span></footer><script src="script.js"></script></body></html>
