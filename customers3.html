<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Customers</title>
<style>
    :root { --blue: #075985; --blue2: #0284c7; --light: #f2f7fa; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, sans-serif; background: var(--light); color: #183247; }
    header { background: var(--blue); color: white; text-align: center; padding: 22px 12px; }
    header h1 { margin: 0 0 8px; }
    nav { background: #0c4a6e; padding: 14px; text-align: center; }
    nav a { color: white; text-decoration: none; margin: 8px 12px; font-weight: bold; display: inline-block; }
    nav a:hover { color: #facc15; }
    .container { width: min(1100px, 94%); margin: 24px auto; }
    .panel { background: white; padding: 18px; margin: 18px 0; border-radius: 9px; box-shadow: 0 2px 8px #00000012; overflow-x: auto; }
    h2 { color: var(--blue); }
    form { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; align-items: end; }
    label { display: block; font-weight: bold; margin-bottom: 5px; }
    input, select { width: 100%; padding: 10px; border: 1px solid #b7c8d3; border-radius: 5px; }
    button { background: var(--blue2); color: white; border: 0; border-radius: 5px; padding: 10px 14px; cursor: pointer; }
    button:hover { background: var(--blue); }
    button.secondary { background: #64748b; }
    button.danger { background: #b91c1c; }
    table { width: 100%; border-collapse: collapse; margin-top: 12px; min-width: 600px; }
    th, td { border: 1px solid #d2dce3; padding: 10px; text-align: left; }
    th { background: var(--blue2); color: white; }
    tr:nth-child(even) { background: #f0f9ff; }
    .message { min-height: 22px; font-weight: bold; color: #075985; }
    .actions { display: flex; gap: 6px; }
    footer { background: var(--blue); color: white; text-align: center; padding: 15px; margin-top: 35px; }
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; }
    .card { background: white; border-radius: 8px; padding: 20px; box-shadow: 0 2px 8px #00000012; }
    .card strong { display: block; font-size: 28px; color: var(--blue2); }
</style>
</head>
<body>
<header><h1>Online Travel Package Booking System</h1><p>Customers</p></header>
<nav><a href="index3.html" >Home</a><a href="packages3.html" >Packages</a><a href="customers3.html" aria-current="page">Customers</a><a href="bookings3.html" >Bookings</a><a href="about3.html" >About</a></nav>
<main class="container">
  <section class="panel">
    <h2>Add / Update customer</h2>
    <form id="recordForm">
      <div><label for="name">Customer Name</label><input id="name" name="name" type="text" placeholder="Enter full name" required></div><div><label for="email">Email</label><input id="email" name="email" type="email" placeholder="Enter email address" required></div><div><label for="phone">Phone</label><input id="phone" name="phone" type="tel" placeholder="Enter phone number" required></div>
      <div><button id="saveButton" type="submit">Add customer</button> <button id="cancelButton" class="secondary" type="button" hidden>Cancel edit</button></div>
    </form>
    <p class="message" id="message" aria-live="polite"></p>
  </section>
  <section class="panel">
    <h2>All Customers</h2>
    <table>
      <thead><tr><th>ID</th><th>Customer Name</th><th>Email</th><th>Phone</th><th>Actions</th></tr></thead>
      <tbody id="records"><tr><td colspan="5">Loading...</td></tr></tbody>
    </table>
  </section>
</main>
<footer>Online Travel Package Booking System - Mini Project</footer>
<script>
const api = "/api/customers";
const idKey = "customer_id";
const fields = [{"key": "name", "label": "Customer Name"}, {"key": "email", "label": "Email"}, {"key": "phone", "label": "Phone"}];
let editingId = null;
function escapeHtml(value) {
  return String(value ?? "").replace(/[&<>"']/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));
}
function showMessage(message) { document.getElementById("message").textContent = message; }
function clearForm() {
  document.getElementById("recordForm").reset();
  editingId = null;
  document.getElementById("saveButton").textContent = "Add customer";
  document.getElementById("cancelButton").hidden = true;
}
async function loadRecords() {
  const tbody = document.getElementById("records");
  try {
    const response = await fetch(api);
    const rows = await response.json();
    if (!response.ok) throw new Error("Could not load records");
    if (!rows.length) { tbody.innerHTML = '<tr><td colspan="5">No records found.</td></tr>'; return; }
    tbody.innerHTML = rows.map(row => `<tr>
      <td>${escapeHtml(row[idKey])}</td>
      ${fields.map(field => `<td>${escapeHtml(row[field.key])}</td>`).join("")}
      <td><div class="actions">
        <button type="button" onclick="editRecord(${Number(row[idKey])})">Edit</button>
        <button type="button" class="danger" onclick="deleteRecord(${Number(row[idKey])})">Delete</button>
      </div></td>
    </tr>`).join("");
  } catch (error) { tbody.innerHTML = '<tr><td colspan="5">Could not load records. Check the server/database.</td></tr>'; }
}
async function editRecord(id) {
  try {
    const response = await fetch(api);
    const rows = await response.json();
    const row = rows.find(item => Number(item[idKey]) === id);
    if (!row) return showMessage("Record not found.");
    fields.forEach(field => document.getElementById(field.key).value = row[field.key] ?? "");
    editingId = id;
    document.getElementById("saveButton").textContent = "Update customer";
    document.getElementById("cancelButton").hidden = false;
    showMessage("Editing record #" + id);
    window.scrollTo({top: 0, behavior: "smooth"});
  } catch (error) { showMessage("Could not open this record."); }
}
async function deleteRecord(id) {
  if (!confirm("Delete record #" + id + "?")) return;
  try {
    const response = await fetch(api + "/" + id, {method: "DELETE"});
    const result = await response.json();
    showMessage(result.message || "Request completed.");
    await loadRecords();
  } catch (error) { showMessage("Could not delete record."); }
}
document.getElementById("recordForm").addEventListener("submit", async event => {
  event.preventDefault();
  const data = {};
  fields.forEach(field => data[field.key] = document.getElementById(field.key).value);
  const url = editingId ? api + "/" + editingId : api;
  const method = editingId ? "PUT" : "POST";
  try {
    const response = await fetch(url, {
      method,
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify(data)
    });
    const result = await response.json();
    showMessage(result.message || "Request completed.");
    if (response.ok) { clearForm(); await loadRecords(); }
  } catch (error) { showMessage("Could not save record. Check the server/database."); }
});
document.getElementById("cancelButton").addEventListener("click", clearForm);
loadRecords();
</script>
</body>
</html>
